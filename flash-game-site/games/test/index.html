<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ruffleテスト</title>


    <!-- 共通CSS -->
    <link
        rel="stylesheet"
        href="../../assets/css/common.css"
    >


    <!--
        公式ダウンロード版Ruffle

        ruffle/ フォルダは
        そのまま使用
    -->
    <script
        src="../../ruffle/ruffle.js"
    ></script>

</head>


<body>


    <!-- ヘッダー -->
    <header>

        <div class="site-header">

            <a
                href="../../index.html"
                class="site-title"
            >
                Flashゲームサイト
            </a>


            <nav>

                <a
                    href="../../index.html"
                >
                    ホーム
                </a>

                <a
                    href="../"
                >
                    ゲーム
                </a>

            </nav>

        </div>

    </header>



    <!-- メイン -->
    <main>

        <section>

            <h1>
                Ruffleテスト
            </h1>


            <p>
                Ruffleが正常に読み込まれているか確認します。
            </p>


            <div id="ruffle-wrapper">

                <div class="game">

                    <p>cr_miyoco_dw_8.swf</p>

                    <div
                        class="ruffle-container"
                        data-swf="./cr_miyoco_dw_8.swf"
                    ></div>

                </div>


                <div class="game">

                    <p>cr_miyoco_dw_1.swf</p>

                    <div
                        class="ruffle-container"
                        data-swf="./cr_miyoco_dw_1.swf"
                    ></div>

                </div>


                <div class="game">

                    <p>cr_miyoco_dw_d1.swf</p>

                    <div
                        class="ruffle-container"
                        data-swf="./cr_miyoco_dw_d1.swf"
                    ></div>

                </div>


                <div class="game">

                    <p>cr_miyoco_dw_d2a.swf</p>

                    <div
                        class="ruffle-container"
                        data-swf="./cr_miyoco_dw_d2a.swf"
                    ></div>

                </div>


                <div class="game">

                    <p>cr_miyoco_dw_d3s.swf</p>

                    <div
                        class="ruffle-container"
                        data-swf="./cr_miyoco_dw_d3s.swf"
                    ></div>

                </div>


                <div class="game">

                    <p>cr_miyoco_dw_d4h.swf</p>

                    <div
                        class="ruffle-container"
                        data-swf="./cr_miyoco_dw_d4h.swf"
                    ></div>

                </div>


                <div class="game">

                    <p>cr_miyoco_dw_d5c.swf</p>

                    <div
                        class="ruffle-container"
                        data-swf="./cr_miyoco_dw_d5c.swf"
                    ></div>

                </div>


                <div class="game">

                    <p>cr_miyoco_dw_d6an.swf</p>

                    <div
                        class="ruffle-container"
                        data-swf="./cr_miyoco_dw_d6an.swf"
                    ></div>

                </div>

            </div>

        </section>

    </main>



    <!-- フッター -->
    <footer>

        <p>
            &copy; 2026 Flashゲームサイト
        </p>

    </footer>


    <script>

        window.addEventListener("DOMContentLoaded", async () => {

            const ruffle = window.RufflePlayer?.newest?.();

            if (!ruffle) {
                return;
            }


            const containers =
                document.querySelectorAll(".ruffle-container");


            for (const container of containers) {

                const player = ruffle.createPlayer();

                const GAME_WIDTH = 800;
                const GAME_HEIGHT = 600;
                const MARGIN = 10;


                function resizeGame() {

                    const viewport = window.visualViewport;

                    const screenWidth =
                        viewport?.width ??
                        document.documentElement.clientWidth;

                    const screenHeight =
                        viewport?.height ??
                        document.documentElement.clientHeight;


                    const maxWidth =
                        Math.max(
                            0,
                            screenWidth - MARGIN * 2
                        );

                    const maxHeight =
                        Math.max(
                            0,
                            screenHeight - MARGIN * 2
                        );


                    let width =
                        Math.min(
                            GAME_WIDTH,
                            maxWidth,
                            maxHeight *
                            GAME_WIDTH /
                            GAME_HEIGHT
                        );


                    width =
                        Math.max(
                            1,
                            Math.floor(width)
                        );


                    const height =
                        Math.max(
                            1,
                            Math.floor(
                                width *
                                GAME_HEIGHT /
                                GAME_WIDTH
                            )
                        );


                    player.style.setProperty(
                        "width",
                        `${width}px`,
                        "important"
                    );

                    player.style.setProperty(
                        "height",
                        `${height}px`,
                        "important"
                    );


                    container.style.width =
                        `${width}px`;

                    container.style.height =
                        `${height}px`;


                    player.setAttribute(
                        "width",
                        String(width)
                    );

                    player.setAttribute(
                        "height",
                        String(height)
                    );

                }


                container.appendChild(player);


                resizeGame();


                window.addEventListener(
                    "resize",
                    resizeGame
                );


                window.addEventListener(
                    "orientationchange",
                    () => {
                        setTimeout(
                            resizeGame,
                            300
                        );
                    }
                );


                window.visualViewport?.addEventListener(
                    "resize",
                    resizeGame
                );


                const swfUrl =
                    new URL(
                        container.dataset.swf,
                        document.baseURI
                    ).href;


                try {

                    await player.ruffle().load(
                        swfUrl
                    );

                } catch (error) {

                    console.error(
                        "Ruffle SWF load failed:",
                        error
                    );

                }

            }

        });

    </script>


</body>

</html>
