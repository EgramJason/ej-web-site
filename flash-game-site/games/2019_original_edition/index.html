
<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CR河原美代子DW研究所</title>

    <!-- 共通CSS -->
    <link
        rel="stylesheet"
        href="https://egramjason.github.io/ej-web-site/flash-game-site/assets/css/common.css"
    >

    <!-- 公式Ruffle -->
    <script src="https://egramjason.github.io/ej-web-site/flash-game-site/ruffle/ruffle.js"></script>

    <!-- Ruffleプレイヤー制御 -->
    <script src="https://egramjason.github.io/ej-web-site/flash-game-site/assets/js/ruffle-player.js"></script>

    <style>
        .ruffle-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 一時停止ボタン */
        .game-controls {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .game-controls button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <header>

        <div class="site-header">

            <a
                href="https://egramjason.github.io/ej-web-site/flash-game-site/"
                class="site-title"
            >
                Flashゲームトップ
            </a>

            <a
                href="https://egramjason.github.io/ej-web-site/flash-game-site/games/"
                class="site-title"
            >
                CR河原美代子DW研究所
            </a>

        </div>

    </header>

    <main>

        <section>

            <h1>
                E-MOD
            </h1>
            
            <div class="ruffle-wrapper">

                <div
                    id="ruffle-container-1"
                    class="ruffle-container"
                    aria-label="Flashゲーム"
                ></div>

            </div>

            <!-- 一時停止ボタン -->
            <div class="game-controls">

                <button
                    id="pause-game"
                    type="button"
                >
                    一時停止
                </button>

            </div>

        </section>

    </main>

    <footer>

        <p>
            &copy; EgramJason
        </p>

    </footer>

    <script>

        window.addEventListener(
            "DOMContentLoaded",
            async () => {

                const ruffle =
                    window.RufflePlayer?.newest?.();

                if (!ruffle) {

                    console.error(
                        "Ruffleを読み込めませんでした。"
                    );

                    return;
                }

                const games = [

                    {
                        container:
                            "ruffle-container-1",

                        swf:
                            "./cr_miyoco_dw_last.swf"
                    },

                ];

                const players = [];

                /*
                 * Ruffleプレイヤー作成
                 */

                for (const game of games) {

                    const container =
                        document.getElementById(
                            game.container
                        );

                    if (!container) {
                        continue;
                    }

                    const player =
                        ruffle.createPlayer();

                    container.replaceChildren(
                        player
                    );

                    players.push({

                        container:
                            container,

                        wrapper:
                            container.parentElement,

                        player:
                            player,

                        swf:
                            game.swf

                    });

                }

                /*
                 * 一時停止状態
                 */

                let gamePaused = false;

                /*
                 * ゲームを停止する
                 */

                function pauseGames() {

                    for (const item of players) {

                        item.player.pause(true);

                    }

                }

                /*
                 * 一時停止ボタン
                 */

                document.getElementById(
                    "pause-game"
                )?.addEventListener(
                    "click",
                    () => {

                        gamePaused = true;

                        pauseGames();

                    }
                );

                /*
                 * 一時停止中にウィンドウへ戻った場合、
                 * 停止処理を再適用する
                 */

                function keepGamesPaused() {

                    if (!gamePaused) {
                        return;
                    }

                    pauseGames();

                }

                /*
                 * ウィンドウがアクティブになったとき
                 */

                window.addEventListener(
                    "focus",
                    keepGamesPaused
                );

                /*
                 * ページの表示状態が変化したとき
                 */

                document.addEventListener(
                    "visibilitychange",
                    keepGamesPaused
                );

                /*
                 * ページが再表示されたとき
                 */

                window.addEventListener(
                    "pageshow",
                    keepGamesPaused
                );

                /*
                 * ゲームのサイズ調整
                 */

                function resizeGames() {

                    const GAME_WIDTH = 900;
                    const GAME_HEIGHT = 600;
                    const MARGIN = 10;

                    const viewport =
                        window.visualViewport;

                    const screenHeight =
                        viewport?.height ??
                        document.documentElement.clientHeight;

                    for (const item of players) {

                        const wrapperWidth =
                            item.wrapper.clientWidth;

                        const maxWidth =
                            Math.max(
                                0,
                                wrapperWidth -
                                MARGIN * 2
                            );

                        const maxHeight =
                            Math.max(
                                0,
                                screenHeight -
                                MARGIN * 2
                            );

                        let width =
                            Math.min(
                                GAME_WIDTH,
                                maxWidth,
                                maxHeight *
                                GAME_WIDTH /
                                GAME_HEIGHT
                            );

                        width =
                            Math.max(
                                1,
                                Math.floor(width)
                            );

                        const height =
                            Math.max(
                                1,
                                Math.floor(
                                    width *
                                    GAME_HEIGHT /
                                    GAME_WIDTH
                                )
                            );

                        /*
                         * Ruffle本体
                         */

                        item.player.style.setProperty(
                            "width",
                            `${width}px`,
                            "important"
                        );

                        item.player.style.setProperty(
                            "height",
                            `${height}px`,
                            "important"
                        );

                        /*
                         * コンテナ
                         */

                        item.container.style.width =
                            `${width}px`;

                        item.container.style.height =
                            `${height}px`;

                        /*
                         * Ruffleのサイズ属性
                         */

                        item.player.setAttribute(
                            "width",
                            String(width)
                        );

                        item.player.setAttribute(
                            "height",
                            String(height)
                        );

                    }

                }

                /*
                 * 初回サイズ設定
                 */

                resizeGames();

                /*
                 * ウィンドウサイズ変更
                 */

                window.addEventListener(
                    "resize",
                    resizeGames
                );

                /*
                 * スマートフォンの縦・横回転
                 */

                window.addEventListener(
                    "orientationchange",
                    () => {

                        setTimeout(
                            resizeGames,
                            300
                        );

                    }
                );

                /*
                 * Safariの表示領域変更
                 */

                window.visualViewport?.addEventListener(
                    "resize",
                    resizeGames
                );

                /*
                 * SWF読み込み
                 */

                for (const item of players) {

                    const swfUrl =
                        new URL(
                            item.swf,
                            document.baseURI
                        ).href;

                    try {

                        await item.player
                            .ruffle()
                            .load(swfUrl);

                    } catch (error) {

                        console.error(
                            "Ruffle SWF load failed:",
                            error
                        );

                    }

                }

            }

        );

    </script>

</body>

</html>
