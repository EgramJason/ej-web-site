<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ruffleテスト</title>


    <!-- 共通CSS -->
    <link
        rel="stylesheet"
        href="../../assets/css/common.css"
    >


    <!-- Ruffle -->
    <script
        src="../../ruffle/ruffle.js"
    ></script>


    <style>

        /*
         * common.css の
         * #ruffle-wrapper / #ruffle-container
         * と同じ動作を各ゲームに適用
         */

        .ruffle-wrapper {
            width: 100%;
            margin: 0 auto;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            overflow: hidden;
        }


        .ruffle-container {
            margin: 0;
            padding: 0;

            flex: 0 0 auto;

            position: relative;
        }


        .ruffle-container ruffle-player {
            display: block !important;

            margin: 0 !important;
            padding: 0 !important;

            max-width: none !important;
            max-height: none !important;

            min-width: 0 !important;
            min-height: 0 !important;
        }


        @media (max-width: 600px) {

            .ruffle-wrapper {
                width: 100%;
                overflow: hidden;
            }

        }

    </style>

</head>


<body>


    <!-- ヘッダー -->
    <header>

        <div class="site-header">

            <a
                href="/flash-game-site/"
                class="site-title"
            >
                Flashゲームサイト
            </a>


            <nav>

                <a
                    href="/flash-game-site/"
                >
                    ホーム
                </a>

                <a
                    href="/game/"
                >
                    ゲーム
                </a>

            </nav>

        </div>

    </header>



    <!-- メイン -->
    <main>


        <!-- 8 -->
        <section>

            <h1>
                CR河原美代子DW_type_e1y
            </h1>


            <p>
                当たり全振りバージョン
            </p>


            <div class="ruffle-wrapper">

                <div
                    id="ruffle-container-1"
                    class="ruffle-container"
                    aria-label="Flashゲーム"
                ></div>

            </div>

        </section>



        <!-- 1 -->
        <section>

            <h1>
                CR河原美代子DW_type_e2h
            </h1>


            <p>
                平群の朝の出現率UP
            </p>


            <div class="ruffle-wrapper">

                <div
                    id="ruffle-container-2"
                    class="ruffle-container"
                    aria-label="Flashゲーム"
                ></div>

            </div>

        </section>



        <!-- d1 -->
        <section>

            <h1>
                CR河原美代子DW_type_e3c
            </h1>


            <p>
                クラクションクラッシュの出現率UP
            </p>


            <div class="ruffle-wrapper">

                <div
                    id="ruffle-container-3"
                    class="ruffle-container"
                    aria-label="Flashゲーム"
                ></div>

            </div>

        </section>



        <section>

            <h1>
                CR河原美代子DW_type_e4s
            </h1>


            <p>
                裁判の出現率UP
            </p>


            <div class="ruffle-wrapper">

                <div
                    id="ruffle-container-1"
                    class="ruffle-container"
                    aria-label="Flashゲーム"
                ></div>

            </div>

        </section>


    </main>

    <!-- フッター -->
    <footer>

        <p>
            &copy; 2026 Flashゲームサイト
        </p>

    </footer>



    <script>

        window.addEventListener(
            "DOMContentLoaded",
            async () => {

                const ruffle =
                    window.RufflePlayer?.newest?.();


                if (!ruffle) {

                    console.error(
                        "Ruffleを読み込めませんでした。"
                    );

                    return;
                }


                const games = [

                    {
                        container:
                            "ruffle-container-1",

                        swf:
                            "./cr_miyoco_dw_e1y.swf"
                    },

                    {
                        container:
                            "ruffle-container-2",

                        swf:
                            "./cr_miyoco_dw_e2h.swf"
                    },

                    {
                        container:
                            "ruffle-container-3",

                        swf:
                            "./cr_miyoco_dw_e3c.swf"
                    },

                    {
                        container:
                            "ruffle-container-4",

                        swf:
                            "./cr_miyoco_dw_e4s.swf"
                    },

                ];


                const players = [];


                /*
                 * Ruffleプレイヤー作成
                 */

                for (const game of games) {

                    const container =
                        document.getElementById(
                            game.container
                        );


                    if (!container) {
                        continue;
                    }


                    const player =
                        ruffle.createPlayer();


                    container.replaceChildren(
                        player
                    );


                    players.push({

                        container:
                            container,

                        wrapper:
                            container.parentElement,

                        player:
                            player,

                        swf:
                            game.swf

                    });

                }



                /*
                 * 正常に表示される1ゲーム版と
                 * 同じサイズ計算
                 *
                 * 重要：
                 * document全体の幅ではなく、
                 * 各wrapperの実際の幅を使う。
                 */

                function resizeGames() {

                    const GAME_WIDTH = 800;
                    const GAME_HEIGHT = 600;
                    const MARGIN = 10;


                    const viewport =
                        window.visualViewport;


                    const screenHeight =
                        viewport?.height ??
                        document.documentElement.clientHeight;


                    for (const item of players) {


                        /*
                         * section内の
                         * 実際に使える幅
                         */

                        const wrapperWidth =
                            item.wrapper.clientWidth;


                        const maxWidth =
                            Math.max(
                                0,
                                wrapperWidth -
                                MARGIN * 2
                            );


                        const maxHeight =
                            Math.max(
                                0,
                                screenHeight -
                                MARGIN * 2
                            );


                        /*
                         * 800×600を基準に
                         * 4:3を維持
                         */

                        let width =
                            Math.min(
                                GAME_WIDTH,
                                maxWidth,
                                maxHeight *
                                GAME_WIDTH /
                                GAME_HEIGHT
                            );


                        width =
                            Math.max(
                                1,
                                Math.floor(width)
                            );


                        const height =
                            Math.max(
                                1,
                                Math.floor(
                                    width *
                                    GAME_HEIGHT /
                                    GAME_WIDTH
                                )
                            );


                        /*
                         * Ruffle本体
                         */

                        item.player.style.setProperty(
                            "width",
                            `${width}px`,
                            "important"
                        );


                        item.player.style.setProperty(
                            "height",
                            `${height}px`,
                            "important"
                        );


                        /*
                         * container
                         */

                        item.container.style.width =
                            `${width}px`;


                        item.container.style.height =
                            `${height}px`;


                        /*
                         * Ruffleにもサイズを指定
                         */

                        item.player.setAttribute(
                            "width",
                            String(width)
                        );


                        item.player.setAttribute(
                            "height",
                            String(height)
                        );

                    }

                }



                /*
                 * 初回サイズ設定
                 */

                resizeGames();



                /*
                 * ウィンドウサイズ変更
                 */

                window.addEventListener(
                    "resize",
                    resizeGames
                );



                /*
                 * スマホの縦・横回転
                 */

                window.addEventListener(
                    "orientationchange",
                    () => {

                        setTimeout(
                            resizeGames,
                            300
                        );

                    }
                );



                /*
                 * SafariのvisualViewport変更
                 */

                window.visualViewport?.addEventListener(
                    "resize",
                    resizeGames
                );



                /*
                 * SWF読み込み
                 */

                for (const item of players) {

                    const swfUrl =
                        new URL(
                            item.swf,
                            document.baseURI
                        ).href;


                    try {

                        await item.player
                            .ruffle()
                            .load(swfUrl);

                    } catch (error) {

                        console.error(
                            "Ruffle SWF load failed:",
                            error
                        );

                    }

                }

            }

        );

    </script>


</body>

</html>
